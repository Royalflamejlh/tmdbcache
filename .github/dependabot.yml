version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Patch bumps across a large dependency tree generate a lot of noise for
    # little benefit; group them into one PR and keep minor/major separate so
    # they still get read individually.
    groups:
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
