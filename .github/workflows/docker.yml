name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared by every metadata-action step below. Without an explicit list the
  # action's defaults publish only `main` on a branch push, with no `latest`.
  TAG_RULES: |
    type=ref,event=branch
    type=ref,event=pr
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=semver,pattern={{major}}
    type=sha,format=short
    type=raw,value=latest,enable={{is_default_branch}}

jobs:
  # Decides where this run may push. Keeping it in one place means the build and
  # merge jobs never disagree, and the workflow still succeeds (build-only)
  # before any Docker Hub credentials have been added.
  config:
    name: Resolve targets
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.resolve.outputs.push }}
      ghcr_image: ${{ steps.resolve.outputs.ghcr_image }}
      # A boolean, deliberately. Job outputs are dropped when their value
      # contains a secret, and the Docker Hub image name embeds the username
      # that is also stored as DOCKERHUB_USERNAME. Jobs that need the name read
      # vars.DOCKERHUB_REPOSITORY directly instead.
      dockerhub_enabled: ${{ steps.resolve.outputs.dockerhub_enabled }}
    steps:
      - name: Resolve push targets
        id: resolve
        env:
          # Set repository variable DOCKERHUB_REPOSITORY to e.g. "youruser/tmdbcache".
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          HAS_DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        run: |
          set -euo pipefail

          # GHCR requires a lowercase repository name, but github.repository keeps
          # the owner's casing verbatim.
          ghcr_image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          # Pull requests build but never publish, since they may come from forks.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            push=false
          else
            push=true
          fi

          dockerhub_enabled=false
          if [[ -n "${DOCKERHUB_REPOSITORY}" \
                && "${HAS_DOCKERHUB_TOKEN}" == "true" \
                && "${HAS_DOCKERHUB_USER}" == "true" ]]; then
            dockerhub_enabled=true
          else
            echo "::notice::Docker Hub not configured; publishing to GHCR only." \
                 "Set the DOCKERHUB_REPOSITORY variable plus DOCKERHUB_USERNAME" \
                 "and DOCKERHUB_TOKEN secrets to enable it."
          fi

          {
            echo "push=${push}"
            echo "ghcr_image=${ghcr_image}"
            echo "dockerhub_enabled=${dockerhub_enabled}"
          } >> "$GITHUB_OUTPUT"

          echo "Push: ${push}"
          echo "GHCR: ${ghcr_image}"
          echo "Docker Hub enabled: ${dockerhub_enabled}"

  # Each architecture is built on a runner of that architecture. Emulating arm64
  # under QEMU turns a ~3 minute Rust build into a ~40 minute one, so native
  # runners are worth the extra manifest-merge step below.
  build:
    name: Build ${{ matrix.platform }}
    needs: config
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Derive a filename-safe platform label
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.config.outputs.push == 'true'
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.config.outputs.ghcr_image }}
          tags: ${{ env.TAG_RULES }}

      # Digests go to GHCR only, and the merge job fans them out to Docker Hub.
      # Naming both registries here would put a comma inside the exporter's
      # `name=` field, which breaks buildx's CSV parsing and fails the build with
      # "tag is needed when pushing to registry".
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          outputs: type=image,name=${{ needs.config.outputs.ghcr_image }},push-by-digest=true,name-canonical=true,push=${{ needs.config.outputs.push }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export the digest
        if: needs.config.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        if: needs.config.outputs.push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Turns the per-architecture digests into a single multi-arch tag per registry.
  merge:
    name: Merge manifests
    needs: [config, build]
    if: needs.config.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.config.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GHCR metadata
        id: meta-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.config.outputs.ghcr_image }}
          tags: ${{ env.TAG_RULES }}

      - name: Push GHCR manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046 # word splitting is the point: one -t per tag
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta-ghcr.outputs.json }}') \
            $(printf '${{ needs.config.outputs.ghcr_image }}@sha256:%s ' *)

      - name: Docker Hub metadata
        id: meta-dockerhub
        if: needs.config.outputs.dockerhub_enabled == 'true'
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_REPOSITORY }}
          tags: ${{ env.TAG_RULES }}

      - name: Push Docker Hub manifest list
        if: needs.config.outputs.dockerhub_enabled == 'true'
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046 # word splitting is the point: one -t per tag
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta-dockerhub.outputs.json }}') \
            $(printf '${{ needs.config.outputs.ghcr_image }}@sha256:%s ' *)

      - name: Inspect the published images
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${{ needs.config.outputs.ghcr_image }}:${{ steps.meta-ghcr.outputs.version }}"
          if [[ "${{ needs.config.outputs.dockerhub_enabled }}" == "true" ]]; then
            docker buildx imagetools inspect \
              "docker.io/${{ vars.DOCKERHUB_REPOSITORY }}:${{ steps.meta-dockerhub.outputs.version }}"
          fi

  # Keeps the Docker Hub description in step with the README.
  #
  # Editing a repository description needs a token with admin scope, which is
  # more than pushing an image requires. If the token cannot do it the sync is
  # skipped rather than failing a build that otherwise published fine.
  description:
    name: Sync Docker Hub description
    continue-on-error: true
    needs: [config, merge]
    if: |
      needs.config.outputs.dockerhub_enabled == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_REPOSITORY }}
          # Docker Hub caps this at 100 bytes.
          short-description: "Self-hosted TMDB-backed video library, a Rust rewrite of MovieDB"
          readme-filepath: ./README.md
